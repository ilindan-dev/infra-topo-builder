version: '2'

sql:
  - name: postgresql
    schema: internal/adapters/postgres/migrations/*.up.sql
    queries: queries/*.sql
    engine: postgresql
    analyzer:
      database: false
    rules:
      - sqlc/db-prepare
      - postgresql-query-too-costly
    gen:
      go:
        package: gen
        sql_package: pgx/v5
        out: internal/adapters/postgres/gen
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "log_status"
            go_type:
              import: "github.com/ilindan-dev/infra-topo-builder/builder/internal/core/domain"
              type: "LogStatus"
          - db_type: "node_kind"
            go_type:
              import: "github.com/ilindan-dev/infra-topo-builder/builder/internal/core/domain"
              type: "NodeKind"